name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. Pushes to main
# are never cancelled: each one is a commit that should be seen to pass.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: oxlint
        run: pnpm lint
      - name: oxfmt
        run: pnpm fmt:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["22.12.0", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Lint what npm would receive, not the workspace: the published
      # package.json is rewritten by publishConfig, and workspace:* by pack.
      # Every exported symbol, as a user imports it, has a doc comment.
      - run: pnpm check:docs
      # Known vulnerabilities in what consumers install: production
      # dependencies only, since a dev tool's advisory is not theirs.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      # The public API of each published package is recorded in etc/*.api.md
      # and reviewed like code. This fails, with a diff, when the built
      # declarations and the record disagree, so a change to the API cannot
      # land without showing up in the commit that makes it. To accept a
      # deliberate change: pnpm api:report
      - run: pnpm api:check
      # Packing @honeybbq/teamspeak runs its prepack script, which copies the
      # root README in; the forwarding package has its own README.
      - name: Check the packed packages
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
          for tarball in "$RUNNER_TEMP"/packs/*.tgz; do
            pnpm exec publint --strict "$tarball"
            pnpm exec attw --profile esm-only "$tarball"
          done

  # Both supported server generations, because they differ in ways that only
  # show up live: TS6 hashes client uids with SHA-256 where TS3 uses SHA-1.
  integration:
    name: Integration (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: TS3
            image: teamspeak:latest
            # TS3 still serves raw ServerQuery on 10011.
            query_host: 127.0.0.1
            query_http: ""
            query_port: 10011
          - name: TS6
            image: teamspeaksystems/teamspeak6-server:latest
            # TS6 dropped raw ServerQuery for HTTP, so the fixture talks
            # WebQuery here — the same commands over a different transport.
            query_host: ""
            query_http: 127.0.0.1:10080
            query_port: 10080
    services:
      teamspeak:
        image: ${{ matrix.server.image }}
        env:
          TS3SERVER_LICENSE: accept
          TSSERVER_LICENSE_ACCEPTED: accept
          TSSERVER_QUERY_HTTP_ENABLED: "1"
        ports:
          - 9987:9987/udp
          - 10011:10011
          - 10080:10080
          # File transfer: the server hands out this port with each transfer
          # key, so it must be reachable at the same number from the runner.
          - 30033:30033
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Wait for the ServerQuery port to answer rather than for a fixed time:
      # TS3 and TS6 take different times to start, and a slow runner longer.
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>"/dev/tcp/127.0.0.1/${{ matrix.server.query_port }}") 2>/dev/null; then
              echo "ServerQuery answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ServerQuery did not answer within 60s" >&2
          exit 1
      # The suite needs channels and permissions. Skipping this is how the
      # tests pass while testing nothing: they skip on permissions instead of
      # failing, which hid a row-parsing bug for months.
      - name: Provision the fixture
        run: |
          sudo apt-get install -y netcat-openbsd >/dev/null
          TS3_QUERY_HOST='${{ matrix.server.query_host }}' \
          TS3_QUERY_HTTP='${{ matrix.server.query_http }}' \
          TS3_QUERY_PORT='${{ matrix.server.query_port }}' \
          ./scripts/ts3-fixture.sh
      - name: Run integration tests
        run: |
          set -a
          . ./ts3-fixture.env
          set +a
          pnpm test:integration
