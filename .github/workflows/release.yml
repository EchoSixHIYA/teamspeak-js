name: Release

# Pushing a tag vX.Y.Z publishes every public package at version X.Y.Z. The
# versions themselves come from changesets (`pnpm version-packages`), which
# keeps the packages in one fixed group.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      # The packages depend on each other's exact version, so publishing one
      # at a version the tag does not name would ship a broken dependency.
      - name: Check the tag matches every package
        run: |
          node -e '
            const fs = require("node:fs");
            const want = process.argv[1];
            for (const dir of fs.readdirSync("packages")) {
              const pkg = JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, "utf8"));
              if (pkg.private) continue;
              if (pkg.version !== want) {
                console.error(`${pkg.name} is at ${pkg.version}, but the tag is v${want}`);
                process.exit(1);
              }
            }
          ' "${GITHUB_REF_NAME#v}"

      # A prerelease goes out under its own dist-tag — 1.0.0-beta.1 under
      # "beta" — so `npm install` keeps resolving to the latest stable release.
      - name: Choose the dist-tag
        id: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm build
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --tag "${{ steps.dist.outputs.tag }}"
        env:
          NPM_CONFIG_PROVENANCE: "true"

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
